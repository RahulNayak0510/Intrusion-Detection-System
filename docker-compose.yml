services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./.docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: "1.0"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      EVE_FILE_PATH: ${EVE_FILE_PATH}
      AUTO_REPLAY_SAMPLE_ON_STARTUP: ${AUTO_REPLAY_SAMPLE_ON_STARTUP}
      INGESTION_POLL_INTERVAL_SECONDS: ${INGESTION_POLL_INTERVAL_SECONDS}
      INGESTION_READ_ERROR_MAX_BACKOFF_SECONDS: ${INGESTION_READ_ERROR_MAX_BACKOFF_SECONDS}
      ANOMALY_ENABLED: ${ANOMALY_ENABLED}
      ALLOWLIST_CIDRS: ${ALLOWLIST_CIDRS}
      ASSET_LABELS_JSON: ${ASSET_LABELS_JSON}
      SEVERITY_MAP_JSON: ${SEVERITY_MAP_JSON}
      RETENTION_DAYS: ${RETENTION_DAYS}
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: "1.5"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    mem_limit: 256m
    cpus: "0.5"

  # ---------------------------------------------------------------------------
  # sensor — OPTIONAL Suricata live capture. OFF by default.
  # Requires: `docker compose --profile sensor up`
  # NOTE: You MUST own/authorize the monitored network. Run at your own risk.
  #   See README / SAFETY section before enabling this profile.
  # ---------------------------------------------------------------------------
  sensor:
    profiles:
      - sensor
    image: jasonish/suricata:6.0
    restart: unless-stopped
    network_mode: "none"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./data/suricata-logs:/var/log/suricata
    entrypoint: ["tail", "-f", "/dev/null"]
    # Real integration: override entrypoint to run Suricata bound to an
    # authorized interface and mount the logs directory for the backend to
    # consume EVE JSON. Example:
    #   entrypoint: ["suricata", "-i", "eth0", "-v"]

volumes:
  mysql-data:
